<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KubeAI Dashboard</title>
  <link rel="stylesheet" href="/css/main.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="#06b6d4" stroke-width="2"/>
            <path d="M16 8 L20 14 L16 12 L12 14 Z" fill="#06b6d4"/>
            <path d="M16 24 L12 18 L16 20 L20 18 Z" fill="#10b981"/>
            <path d="M8 16 L14 12 L12 16 L14 20 Z" fill="#3b82f6"/>
            <path d="M24 16 L18 20 L20 16 L18 12 Z" fill="#8b5cf6"/>
            <circle cx="16" cy="16" r="3" fill="#06b6d4"/>
          </svg>
          <span class="logo-text">KubeAI</span>
        </div>
        <div class="cluster-badge" id="topbar-cluster-badge" style="cursor:pointer;position:relative;" onclick="toggleClusterDropdown()" title="Switch active cluster">
          <i data-lucide="server" class="icon-sm"></i>
          <span id="topbar-cluster-name">default</span>
          <i data-lucide="chevron-down" style="width:12px;height:12px;margin-left:2px;"></i>
        </div>
        <div id="cluster-dropdown" style="display:none;position:absolute;top:48px;left:12px;z-index:1000;background:var(--bg-card);border:1px solid var(--border-color);border-radius:6px;min-width:180px;box-shadow:0 4px 16px rgba(0,0,0,0.4);"></div>
      </div>
      <div class="topbar-right">
        <div id="connection-status" class="connection-status status-connecting">
          <span class="status-dot"></span>
          <span class="status-label">Connecting...</span>
        </div>
        <div class="topbar-meta">
          <i data-lucide="cpu" class="icon-sm"></i>
          <span id="header-agent-count">0 agents</span>
        </div>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        <ul class="nav-list">
          <li>
            <a href="#clusters" class="nav-link" data-page="clusters">
              <i data-lucide="server" class="nav-icon"></i>
              <span>Clusters</span>
            </a>
          </li>
          <li>
            <a href="#overview" class="nav-link" data-page="overview">
              <i data-lucide="layout-dashboard" class="nav-icon"></i>
              <span>Overview</span>
            </a>
          </li>
          <li>
            <a href="#agents" class="nav-link" data-page="agents">
              <i data-lucide="cpu" class="nav-icon"></i>
              <span>Agents</span>
            </a>
          </li>
          <li>
            <a href="#tasks" class="nav-link" data-page="tasks">
              <i data-lucide="list-checks" class="nav-icon"></i>
              <span>Tasks</span>
            </a>
          </li>
          <li>
            <a href="#memory" class="nav-link" data-page="memory">
              <i data-lucide="database" class="nav-icon"></i>
              <span>Memory</span>
            </a>
          </li>
          <li>
            <a href="#blueprints" class="nav-link" data-page="blueprints">
              <i data-lucide="file-code-2" class="nav-icon"></i>
              <span>Blueprints</span>
            </a>
          </li>
          <li>
            <a href="#monitoring" class="nav-link" data-page="monitoring">
              <i data-lucide="activity" class="nav-icon"></i>
              <span>Monitoring</span>
            </a>
          </li>
          <li>
            <a href="#pools" class="nav-link" data-page="pools">
              <i data-lucide="layers" class="nav-icon"></i>
              <span>Pools</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-bottom">
          <div class="version-badge">
            <i data-lucide="tag" class="icon-xs"></i>
            <span>v0.1.0</span>
          </div>
        </div>
      </nav>

      <main class="content">
        <div id="page-container">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Connecting to KubeAI control plane...</p>
          </div>
        </div>
      </main>
    </div>

    <footer class="statusbar">
      <div class="statusbar-left">
        <span class="statusbar-item">
          <i data-lucide="layers" class="icon-xs"></i>
          <span>context: <span id="statusbar-cluster-name">default</span></span>
        </span>
        <span class="statusbar-divider">|</span>
        <span class="statusbar-item">
          <i data-lucide="box" class="icon-xs"></i>
          <span>namespace: default</span>
        </span>
      </div>
      <div class="statusbar-right">
        <span class="statusbar-item" id="statusbar-ws">
          <span class="status-dot-sm connecting"></span>
          <span>WebSocket: connecting</span>
        </span>
        <span class="statusbar-divider">|</span>
        <span class="statusbar-item" id="statusbar-updated">
          Last updated: --
        </span>
      </div>
    </footer>
  </div>

  <script src="/js/ws.js"></script>
  <script src="/js/pages/overview.js"></script>
  <script src="/js/pages/agents.js"></script>
  <script src="/js/pages/tasks.js"></script>
  <script src="/js/pages/memory.js"></script>
  <script src="/js/pages/blueprints.js"></script>
  <script src="/js/pages/monitoring.js"></script>
  <script src="/js/pages/clusters.js"></script>
  <script src="/js/pages/pools.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
