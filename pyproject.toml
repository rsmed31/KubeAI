[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "litellm=1.80.1",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "click>=8.1.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "etcd3",
    "prometheus_client>=0.20.0",
]

[project.optional-dependencies]
reranking = ["sentence-transformers"]
postgres = ["psycopg2-binary>=2.9"]
redis = ["redis>=5.0"]
chromadb = ["chromadb>=0.5"]
langchain = ["langchain>=0.3", "langchain-community>=0.3", "langchain-core>=0.3"]
llamaindex = ["llama-index>=0.10"]
autogen = ["pyautogen>=0.2"]
crewai = ["crewai>=0.1"]
frameworks = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "llama-index>=0.10",
    "pyautogen>=0.2",
    "crewai>=0.1",
]
dev = ["pytest", "pytest-cov", "respx>=0.20", "httpx>=0.27"]
all = [
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "chromadb>=0.5",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "llama-index>=0.10",
    "pyautogen>=0.2",
    "crewai>=0.1",
    "sentence-transformers",
]

[project.scripts]
agentctl = "KubeAI.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["KubeAI*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
